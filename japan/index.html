<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Поездки</title>
<link rel="manifest" href="/japan/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/japan/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="/japan/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-title" content="Япония">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eeeeee; --white:#fff; --surface:#fff; --set-bg:#f2f2f2; --label:#000; --secondary:#727272; --tertiary:#aeaeb2;
  --control:#1a1a1a; --blue:#0088ff; --danger:#ff383c; --ok:#248a3d;
  --fill-tertiary:rgba(118,118,128,.12); --fill-quaternary:rgba(116,116,128,.08);
  --glass:#f7f7f7; --glass-shadow:0 8px 40px rgba(0,0,0,.12);
  --sep:rgba(60,60,67,.18); --press:rgba(0,0,0,.04); --tab-pill:rgba(0,0,0,.07);
  --grabber:#d9d9d9; --placeholder:#c7c7cc; --primary-bg:#2c2c2e; --primary-fg:#fff;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --sf:-apple-system,"SF Pro Text","SF Pro",BlinkMacSystemFont,"Inter",sans-serif;
  --mglass:rgba(248,248,248,.84);--mtext:#1a1a1a;--mtitle:#bfbfbf;--mfield:rgba(120,120,128,.16);--msep:#e6e6e6;--mred:#ff383c;
  --accent:#2c2c2e; --on-accent:#fff; --green:#58a00c; --raised:#fff; --chip-track:#f3f3f3; --chip-thumb:#fff; --chip-hl:#fff; --dash:rgba(120,120,128,.28);
  --accent-shadow:0 8px 24px rgba(0,0,0,.28);
  --badge-bg:#58a00c; --badge-fg:#fff; --badge-hl:rgba(150,201,96,1); --badge-edge:#005415; --badge-shadow:0 4px 10px rgba(0,0,0,.16);
  --thumb-shadow:0 4px 4px rgba(0,0,0,.12);
  --receipt-shadow:0 10px 30px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ok:#30d158; --page:#000; --white:#000; --surface:#1c1c1e; --set-bg:#1c1c1e; --label:#fff; --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3);
    --control:#fff; --fill-tertiary:rgba(120,120,128,.32); --fill-quaternary:rgba(120,120,128,.24);
    --glass:#2c2c2e; --glass-shadow:0 8px 40px rgba(0,0,0,.4);
    --sep:rgba(255,255,255,.15); --press:rgba(255,255,255,.08); --tab-pill:rgba(255,255,255,.16);
    --grabber:rgba(255,255,255,.3); --placeholder:rgba(235,235,245,.3); --primary-bg:#f2f2f7; --primary-fg:#000;
    --mglass:rgba(44,44,46,.86);--mtext:#fff;--mtitle:rgba(235,235,245,.3);--mfield:rgba(120,120,128,.32);--msep:rgba(255,255,255,.12);
    --accent:#f2f2f7; --on-accent:#000; --green:#7ac142; --raised:#2c2c2e; --chip-track:#1c1c1e; --chip-thumb:#3a3a3c; --chip-hl:rgba(255,255,255,.08); --dash:rgba(120,120,128,.4);
    --accent-shadow:0 8px 24px rgba(0,0,0,.5);
    --badge-bg:#3f7d0b; --badge-fg:#eaffd6; --badge-hl:rgba(122,193,66,.45); --badge-edge:rgba(0,0,0,.45); --badge-shadow:0 4px 12px rgba(255,255,255,.14);
    --thumb-shadow:0 4px 8px rgba(255,255,255,.08);
    --receipt-shadow:0 10px 30px rgba(255,255,255,.07);
    color-scheme:dark;
  }
  .lg:not(.round--blue){background:rgba(255,255,255,.08);
    box-shadow:0 12px 26px -8px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3),
      inset 1.5px 1.5px 1px rgba(255,255,255,.18),inset -1px -1px 1px rgba(255,255,255,.08),
      inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 -10px 22px rgba(255,255,255,.04)}
  .lg::after{background:linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.08) 100%)}
  .c-osaka{--b:rgba(109,124,255,.28);--c:#8b96ff}
  .c-kyoto{--b:rgba(0,195,208,.26)}
  .c-tokyo{--b:rgba(131,209,48,.26)}
  #menu.lg,#alert.lg{background:rgba(44,44,46,.5)!important;
    box-shadow:0 12px 26px -8px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3),inset 1.5px 1.5px 1px rgba(255,255,255,.18),inset -1px -1px 1px rgba(255,255,255,.08),inset 0 0 0 .5px rgba(255,255,255,.16)!important}
  #alert .alert__fields,#alert .alert__btn--cancel{background-color:rgba(120,120,128,.3)!important;box-shadow:inset 1px 1px 1px rgba(255,255,255,.12)!important}
  .status svg path,.status svg rect{fill:#fff;stroke:#fff}
  /* плашки внутри карточек и шторок — на ступень светлее контейнера, иначе сливаются */
  .sheet{--set-bg:#2c2c2e}
  .day,.stay{--surface:#2c2c2e}
  .sheet .hotel{--surface:#3a3a3c}
  .pg .hotel,.pg .steps,.pg .check{--surface:#2c2c2e}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);font-family:"Inter",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:fixed;width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;touch-action:manipulation;text-align:inherit}
a{color:inherit;text-decoration:none}

/* ---------- phone frame ---------- */
.stage{min-height:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.phone{position:relative;width:393px;height:min(844px,calc(100vh - 32px));height:min(844px,calc(100dvh - 32px));background:var(--white);border-radius:40px;overflow:hidden;flex:none;box-shadow:0 30px 80px rgba(0,0,0,.12);--safe:62px}
.status{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;gap:154px;align-items:center;justify-content:center;padding:21px 24px 19px;pointer-events:none}
.status__time{flex:1 0 0;height:22px;display:flex;align-items:center;justify-content:center;padding-top:1.5px;font:590 17px/22px var(--sf)}
.status__levels{flex:1 0 0;height:22px;display:flex;gap:7px;align-items:center;justify-content:center;padding:1px 1px 0 0}
.status__levels svg{display:block}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));scrollbar-width:none;display:flex;flex-direction:column}
.scroll::-webkit-scrollbar{display:none}
.safe-spacer{height:var(--safe);flex:none}
#view{flex:1 0 auto;display:flex;flex-direction:column}
@media (max-width:500px){
  html,body{background:var(--white)}
  .stage{padding:0;display:block}
  .phone{width:100%;height:100vh;height:-webkit-fill-available;height:100dvh;border-radius:0;box-shadow:none;--safe:calc(env(safe-area-inset-top,0px) + 8px)}
  .status{display:none}
}

/* ---------- glass ---------- */
.glass{position:relative;border-radius:296px;background:var(--glass);box-shadow:var(--glass-shadow)}
.lg{background:rgba(255,255,255,.42);
  -webkit-backdrop-filter:blur(8px) saturate(190%) brightness(1.06);backdrop-filter:blur(8px) saturate(190%) brightness(1.06);
  box-shadow:0 12px 26px -8px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06),
    inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1px -1px 1px rgba(255,255,255,.55),
    inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 -10px 22px rgba(255,255,255,.28)}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.3) 100%);
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.2px}

/* ---------- toolbar ---------- */
.topfade{position:absolute;left:0;right:0;top:0;z-index:3;background:var(--white);height:var(--safe);pointer-events:none}
.bar{position:sticky;top:var(--safe);z-index:5;padding-bottom:10px;flex:none;border-bottom:.5px solid transparent;transition:border-color .2s;background:var(--white);transform:translateZ(0)}
.toolbar{position:relative;z-index:1;flex:none}
.chips-slot{position:sticky;top:calc(var(--safe) + 54px);z-index:4;flex:none;background:var(--white);border-bottom:.5px solid transparent;transition:border-color .2s;transform:translateZ(0)}
.chips-slot:empty{display:none}
.is-compact .bar{border-bottom-color:var(--sep)}
.is-compact .scroll:has(.chips-slot:not(:empty)) .bar{border-bottom-color:transparent}
.is-compact .scroll:has(.chips-slot:not(:empty)) .chips-slot{border-bottom-color:var(--sep)}
.ctitle{flex:1 0 0;min-width:0;display:flex;flex-direction:column;justify-content:center;height:38px;padding:1px 8px 0 2px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .35s cubic-bezier(.2,1.2,.35,1);pointer-events:none}
.ctitle b{font:590 15px/18px var(--sf);letter-spacing:-.23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle span{font:510 12px/14px var(--sf);color:var(--secondary);white-space:nowrap}
.is-compact .ctitle{opacity:1;transform:none}
.toolbar__controls{display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:44px;position:relative;z-index:1}
.toolbar__trailing{display:flex;gap:10px;align-items:center}
#phone .pg-back,#phone .ptitle,#phone .pg-add{display:none}
#phone.is-page .pg-back{display:flex}
#phone.is-page .ptitle{display:flex}
#phone.is-page .toolbar{display:none}
#phone.is-page .toolbar__trailing .glass{display:none}
#phone.is-page.has-add .toolbar__trailing .pg-add{display:flex}
#phone.is-guest .toolbar__trailing .pg-add{display:none}
.ptitle{position:absolute;left:72px;right:72px;top:0;height:44px;align-items:center;justify-content:center;pointer-events:none}
#phone.is-page .ctitle{display:flex;visibility:hidden;flex:1 0 0}
#phone.is-page .tabbar{transform:translateY(150%);opacity:0;pointer-events:none}
.tabbar{transition:transform .5s cubic-bezier(.3,1.25,.5,1),opacity .3s}
#phone .pg-add{background:rgba(0,136,255,.86);box-shadow:0 8px 24px rgba(0,136,255,.28),inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 1px rgba(255,255,255,.25)}
#phone .pg-add .sym{color:#fff}
#phone.is-page #chipsSlot .chips{padding-top:12px}
#phone .ptitle__ic{display:none}
.ptitle__ic{width:32px;height:32px;border-radius:9px;background:var(--set-bg);display:flex;align-items:center;justify-content:center;font:400 18px/1 var(--emoji);flex:none}
.ptitle b{font:600 17px/22px var(--sf);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{display:flex;flex-direction:column;gap:20px;padding:16px 16px 0}
.sets.sets--grid{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
.sets.sets--grid .set{flex:none}
.set.is-locked{opacity:.4}
/* свайп влево — удалить: едет содержимое, разделитель стоит */
[data-sw]{touch-action:pan-y;overflow:hidden;-webkit-user-select:none;user-select:none}
#phone #sheet{overflow:clip}
#phone #sheetBody{overflow-x:clip}
[data-sw] > *{transform:translate3d(var(--sx,0px),0,0);transition:transform .4s cubic-bezier(.3,1.25,.5,1)}
[data-sw].sw-drag > *{transition:none}
.sw-del{position:absolute;top:50%;right:-64px;width:64px;height:44px;margin-top:-22px;border-radius:22px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center}
#docsBox .att{position:relative}
.sw-del svg{width:20px;height:20px}
.addmenu{position:absolute;z-index:40;right:16px;top:calc(var(--safe) + 52px);left:auto}
.addmenu button i{display:none}
.acc-mate{display:none}.is-mate .acc-mate{display:inline}.is-mate .acc-guest{display:none}
.btn-group{height:44px;display:flex;gap:20px;align-items:center}
.btn-group--1{width:44px;padding:0 4px}
.sym{position:relative;width:36px;height:36px;display:block;color:var(--control);border-radius:100px}
.sym svg{display:block;width:100%;height:100%}
.toolbar__title{padding:0 16px;transform-origin:0 50%}
.toolbar__title h1{font-weight:700;font-size:34px;line-height:41px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar__title p{font-weight:500;font-size:15px;line-height:20px;color:var(--secondary)}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;z-index:5;left:0;bottom:0;width:100%;display:flex;gap:16px;align-items:center;justify-content:flex-end;padding:16px 25px 24px;pointer-events:none}
.tabbar > *{pointer-events:auto}
.tabbar__buttons{position:relative;flex:none;width:184px;height:54px;display:flex;align-items:center;padding:0 2px}
.tabbar__bg{position:absolute;inset:-4px}
.tab{position:relative;flex:1 0 0;height:54px;margin-right:-8px;color:var(--label);transition:color .3s}
.tab:last-child{margin-right:0}
.tab svg{position:absolute;inset:0;width:100%;height:100%}
.tab.is-active{color:var(--blue)}
.tab-pill{position:absolute;top:0;bottom:0;left:0;width:99px;border-radius:100px;background:var(--tab-pill);transition:transform .55s cubic-bezier(.3,1.45,.5,1),width .55s cubic-bezier(.3,1.45,.5,1)}
.tabbar__add{position:relative;width:54px;height:54px;flex:none;margin-left:auto}
.tabbar__add button{position:absolute;inset:0;color:var(--label);display:flex;align-items:center;justify-content:center}
.tabbar__add svg{display:block;width:26px;height:26px}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;align-items:center;padding:16px;overflow-x:auto;scrollbar-width:none}
#chipsSlot .chips{padding-top:20px}
.is-compact #chipsSlot .chips{padding-top:8px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;justify-content:center;padding:5px 12px;border:2px solid transparent;border-radius:1000px;flex:none;font:500 15px/20px "Inter",sans-serif;white-space:nowrap;transition:background .25s,color .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.chip__label{padding:0 4px}
.chip__n{opacity:.55;padding-right:2px}
.c-osaka{--c:#6155f5;--b:rgba(109,124,255,.16);--ab:#6d7cff}
.c-kyoto{--c:#00a8b3;--b:rgba(0,195,208,.14);--ab:#00d2e0}
.c-tokyo{--c:#58a00c;--b:rgba(131,209,48,.16);--ab:#83d130}
.c-all,.c-trip{--c:var(--label);--b:var(--fill-tertiary);--ab:#8e8e93}
.chip[class*="c-"]{background:var(--b);color:var(--c)}
.chip.is-active{border-style:dashed;border-color:var(--ab)}
.chip--sm{padding:2px 9px;border-width:0;font-size:13px;line-height:18px}

/* ---------- day cards ---------- */
.days{display:flex;flex-direction:column;gap:8px;padding:8px 16px 0}
.stay{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;border-radius:32px;background:var(--set-bg)}
.stay__tx{min-width:0}
.stay__city{font-weight:700;font-size:22px;line-height:28px;letter-spacing:-.26px;transform:skewX(-1.31deg)}
.stay__hotel{font-weight:600;font-size:16px;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stay__meta{font-weight:400;font-size:14px;line-height:19px;color:var(--secondary);margin-top:1px}
.stay__map{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.06);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.stay__map:active{transform:scale(.88)}
.gm{display:block;width:auto;height:22px}
.hotel .stay__map{width:40px;height:40px}
.hotel .gm{height:19px}
.day{position:relative;border-radius:32px;background:var(--set-bg);padding:20px 16px 16px;display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .5s cubic-bezier(.25,1.5,.4,1);border:2px solid transparent}
.day.is-today{border-color:var(--blue)}
.day__top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 4px}
.day__date{display:flex;align-items:baseline;gap:8px}
.day__date b{font-weight:700;font-size:34px;line-height:38px;letter-spacing:-.4px;transform:skewX(-1.31deg)}
.day__date span{font-weight:500;font-size:15px;line-height:20px;color:var(--secondary)}
.day__date .today{color:var(--blue)}
.day__cities{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;padding-top:6px}
.notes{display:flex;flex-direction:column;gap:6px}
.note{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:18px;background:var(--surface);font-size:14px;line-height:19px;text-align:left;width:100%}
.note__ic{font:400 16px/19px var(--emoji);flex:none;width:20px;text-align:center}
.note__tx{flex:1;min-width:0}
.note__tx b{font-weight:600}
.note__go{flex:none;color:var(--tertiary);align-self:center}
.note__go svg{display:block;width:8px;height:13px}
a.note{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
a.note:active{transform:scale(.97)}
.round{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--control);flex:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.round:active{transform:scale(.84)}
.round svg{width:20px;height:20px}
.round--blue{position:relative;background:rgba(0,136,255,.86);color:#fff;box-shadow:0 8px 24px rgba(0,136,255,.28),inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 1px rgba(255,255,255,.25),inset 0 0 0 .5px rgba(255,255,255,.35)}
.day .round{background:var(--surface)}


/* группы мест в карточке дня */
.grps{display:flex;flex-direction:column;gap:12px}
.grp__label{font-weight:500;font-size:13px;line-height:18px;color:var(--secondary);margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:1000px;background:var(--surface);font-size:14px;line-height:19px;font-weight:500}
.pill__ic{font:400 14px/19px var(--emoji)}
.sum{display:flex;flex-direction:column;gap:12px;padding:0 4px}
.sum__row{display:flex;align-items:flex-start;gap:12px}
.sum__ic{width:24px;flex:none;text-align:center;font:400 19px/24px var(--emoji)}
.sum__tx{min-width:0;font-size:16px;line-height:21px;padding-top:1px}
.sum__tx b{font-weight:600}
.sum__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sum__time{padding:1px 8px;border-radius:9px;background:var(--surface);font-weight:600;font-size:14px;line-height:19px;font-variant-numeric:tabular-nums}
.leg + .leg{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(120,120,128,.28)}
.leg__no{font-weight:500;font-size:13px;color:var(--secondary);margin-left:2px}
.sheet .hotel .btn-route{height:44px;font-size:15px;background:var(--surface);box-shadow:none}
.sum__tx small{display:block;font-size:14px;line-height:19px;color:var(--secondary);margin-top:1px}
.times{display:flex;flex-direction:column;gap:6px}
.time{display:flex;align-items:center;gap:10px;font-size:15px;line-height:20px}
.time b{flex:none;min-width:62px;padding:3px 9px;border-radius:10px;background:var(--surface);font-weight:600;font-size:14px;line-height:19px;font-variant-numeric:tabular-nums;text-align:center}
.time span{min-width:0}
/* задачи с чекбоксами прямо в карточке */
.day .tasks{background:var(--surface)}
/* вложения дня: QR и билеты */
.att{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border-radius:20px;background:var(--surface);text-align:left;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.att:active{transform:scale(.97)}
.att__thumb{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;font:400 22px/1 var(--emoji);border:1px solid var(--sep)}
.att__thumb img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.att__tx{flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:600}
.att__tx small{display:block;font-weight:400;font-size:13px;line-height:18px;color:var(--secondary)}
.att.is-locked .att__tx small{color:var(--secondary)}
.att.is-locked .att__thumb{filter:grayscale(1);opacity:.6}

/* ---------- prep: folders ---------- */
.sets{display:flex;gap:8px;padding:20px 16px 0;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}

.set{position:relative;height:179px;border-radius:32px;background:var(--set-bg);overflow:hidden;padding:24px 20px 20px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .5s cubic-bezier(.25,1.5,.4,1);-webkit-transform:translateZ(0);transform:translateZ(0)}

}

/* ---------- checklist ---------- */

/* ---------- sheet ---------- */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s}

.sheet{position:absolute;z-index:21;left:0;right:0;bottom:0;top:52px;background:var(--surface);border-radius:38px 38px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.12);transform:translateY(105%);visibility:hidden;transition:transform .55s cubic-bezier(.22,1.12,.36,1),visibility 0s .55s;display:flex;flex-direction:column;overflow:hidden}
.sheet.is-open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.22,1.12,.36,1),visibility 0s}
@media (max-width:500px){.sheet{top:calc(env(safe-area-inset-top,0px) + 12px)}}

.sheet__blur{position:absolute;inset:0}

.sheet__blur i:nth-child(1){-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);-webkit-mask:linear-gradient(to top,transparent 0,#000 25%);mask:linear-gradient(to top,transparent 0,#000 25%)}
.sheet__blur i:nth-child(2){-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask:linear-gradient(to top,transparent 15%,#000 50%);mask:linear-gradient(to top,transparent 15%,#000 50%)}
.sheet__blur i:nth-child(3){-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask:linear-gradient(to top,transparent 40%,#000 75%);mask:linear-gradient(to top,transparent 40%,#000 75%)}
.sheet__blur i:nth-child(4){-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask:linear-gradient(to top,transparent 65%,#000 100%);mask:linear-gradient(to top,transparent 65%,#000 100%)}

.sheet__body::-webkit-scrollbar{display:none}
.sheet__foot{position:absolute;z-index:6;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateZ(0);-webkit-transform:translateZ(0);isolation:isolate}
.sheet__foot[hidden]{display:none}
.sheet__add{position:relative;z-index:1;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transform:translateZ(0);display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:1000px;background:#fff;color:#000;font-weight:600;font-size:16px;
  box-shadow:0 6px 24px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.sheet__add:active{transform:scale(.96) translateZ(0)}
.sheet.has-foot .sheet__body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.doc-del{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--secondary);margin-right:-4px}
.doc-del svg{width:20px;height:20px}
.doc-del:active{background:rgba(120,120,128,.16)}
.alert__btn--danger{background:var(--danger)!important}
.sheet__map .gm{height:22px}
.sheet__acts{display:flex;gap:10px}
.sheet__acts [hidden]{display:none}
.sheet__add{background:rgba(0,136,255,.86)!important;color:#fff;box-shadow:0 8px 24px rgba(0,136,255,.28),inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 1px rgba(255,255,255,.25)!important}
.daymenu{position:absolute;z-index:8;right:16px;top:62px;left:auto}
.daymenu button i{display:none}
.sheet__body > *{flex:none}
.stack{display:flex;flex-direction:column;gap:8px}
.sh-kicker{font-weight:500;font-size:15px;line-height:20px;color:var(--secondary);margin-bottom:4px}
.sh-title{font-weight:700;font-size:28px;line-height:34px;letter-spacing:-.4px}
.sh-head .wrap{margin-top:12px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.label{font-weight:500;font-size:15px;line-height:20px;color:var(--secondary);margin-bottom:8px}

.stop__tx{flex:1;min-width:0;font-size:16px;line-height:21px}

.step::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:600 12px/1 "Inter",sans-serif;background:var(--surface);color:var(--secondary)}

/* ---------- menu & alert ---------- */
.menu-catch{position:absolute;inset:0;z-index:44;display:none}
.menu-catch.is-open{display:block}
.menu{position:absolute;z-index:45;padding:10px 0;border-radius:32px;font-family:var(--sf);color:var(--mtext);display:none;opacity:0;transform:scale(.6)}
.menu.is-open{opacity:1;transform:none;transition:transform .42s cubic-bezier(.3,1.32,.5,1),opacity .18s}

.menu__items{display:flex;flex-direction:column;padding:0 16px}

.menu__item{display:flex;align-items:center;gap:8px;width:100%;padding:0 8px 0 6px;border-radius:14px;text-align:left;color:var(--mtext);font:400 17px/20px var(--sf);letter-spacing:-.43px}

.menu__ic{width:28px;flex:none;text-align:center;font:400 17px/22px var(--emoji)}
.menu__label{flex:1 0 0;min-width:0;padding:10px 0}
#menu.lg,#alert.lg{background:rgba(255,255,255,.46);
  -webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.06);backdrop-filter:blur(14px) saturate(190%) brightness(1.06);
  box-shadow:0 12px 26px -8px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06),0 8px 40px rgba(0,0,0,.12),
    inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1px -1px 1px rgba(255,255,255,.55),
    inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 -10px 22px rgba(255,255,255,.28)}
.alert-ov{position:absolute;inset:0;z-index:46;background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .25s}
.alert-ov.is-open{opacity:1;pointer-events:auto}
.alert{position:absolute;z-index:47;left:0;right:0;top:0;bottom:0;width:300px;height:fit-content;margin:auto;padding:14px;border-radius:34px;
  display:none;flex-direction:column;gap:10px;font-family:var(--sf);color:var(--mtext);opacity:0;transform:scale(1.1)}
.alert.is-open{opacity:1;transform:none;transition:transform .38s cubic-bezier(.3,1.25,.5,1),opacity .2s}
.alert.is-closing{opacity:0;transform:scale(.96);transition:transform .2s ease-in,opacity .2s ease-in}
.alert__title{padding:8px 8px 0;font:590 17px/22px var(--sf);letter-spacing:-.43px}
.alert__text{padding:0 8px 4px;font:400 15px/20px var(--sf);letter-spacing:-.23px;color:var(--secondary)}
.alert__fields{display:flex;flex-direction:column;border-radius:26px;background:rgba(120,120,128,.14);overflow:hidden;margin-bottom:9px;
  box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1px -1px 1px rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 -10px 22px rgba(255,255,255,.28)}
.alert__row{height:52px;padding:0 16px;display:flex}
.alert__in{flex:1 0 0;min-width:0;height:100%;border:0;background:none;outline:none;font:510 17px/20px var(--sf);letter-spacing:-.43px;color:var(--mtext);caret-color:var(--blue);padding:0;-webkit-appearance:none}

.alert__btns{display:flex;gap:8px}

.alert__btn:active{transform:scale(.95)}
.alert__btn--cancel{background:rgba(120,120,128,.14);color:var(--mtext);box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1px -1px 1px rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.7)}
.alert__btn--ok{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12),inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 1px rgba(255,255,255,.25)}
.toast{position:absolute;z-index:40;left:50%;bottom:120px;transform:translate(-50%,20px);background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:18px;font-size:14px;line-height:18px;opacity:0;transition:opacity .3s,transform .5s cubic-bezier(.2,1.5,.35,1);pointer-events:none;max-width:86%;width:max-content;white-space:pre-line;text-align:center}

[hidden]{display:none!important}

.toolbar__title h1{display:flex;align-items:center;gap:10px}
.toolbar__title h1 .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ttl-ill{width:40px;height:40px;flex:none;object-fit:contain}
.toolbar__title p{font-weight:400;font-size:14px;line-height:19px}
#phone.is-page .toolbar__title p{font-weight:500;font-size:15px;line-height:20px}
.toolbar__title p:empty{display:none}
#phone .pg-add,.round--blue,#phone .sheet__add.round{background:var(--accent)!important;box-shadow:var(--accent-shadow)!important}
#phone .pg-add .sym,.round--blue,#phone .sheet__add.round{color:var(--on-accent)!important}
#phone .pg-add.lg::after,.round--blue::after,#phone .sheet__add.round::after{display:none}
.sheet__add:not(.round){background:var(--accent)!important;color:var(--on-accent)!important;box-shadow:var(--accent-shadow)!important}
.alert__btn--ok{background:var(--accent);color:var(--on-accent);box-shadow:var(--accent-shadow)}
.alert__btn--ok.alert__btn--danger{color:#fff}

/* чипы-переключатели: подложка + «бегунок» у выбранного, число снаружи */
.chip{gap:0;padding:2px 10px 2px 2px;border:0;background:var(--chip-track);box-shadow:inset 0 2px 4px rgba(0,0,0,.04);color:var(--label)}
.chip.is-active{gap:4px}
.chip:not(:has(.chip__n)):not(:has(svg)){padding-right:2px}
.chip__seg{display:block;padding:6px 8px 6px 16px;border-radius:50px;font:500 15px/20px "Inter",sans-serif;color:var(--label);white-space:nowrap;transition:background .25s,box-shadow .25s}
.chip:not(:has(.chip__n)):not(:has(svg)) .chip__seg,.chip.is-active .chip__seg{padding-right:16px}
.chip.is-active .chip__seg{background:var(--chip-thumb);box-shadow:inset 0 -2px 2px var(--chip-hl),var(--thumb-shadow)}
.tab-pill{box-shadow:var(--thumb-shadow)}
.chip__n{opacity:1;padding:0 2px;font:400 14px/19px "Inter",sans-serif;color:var(--secondary)}
.chip svg{width:14px;height:14px;flex:none;margin-left:4px;color:var(--control)}
.chip[class*="c-"]{background:var(--chip-track);color:var(--label)}
.chip.is-active{border:0}
.seg{gap:8px}
.seg .chip{padding:2px}
.seg .chip:not(.is-active) .chip__seg{padding-right:16px}

/* бейдж города */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:1000px;background:var(--badge-bg);color:var(--badge-fg);font:600 11px/18px "Inter",sans-serif;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;
  box-shadow:inset 0 3px 3px var(--badge-hl),inset 0 -3px 3px var(--badge-hl),var(--badge-shadow),inset 0 0 2px var(--badge-edge)}
.tag{display:inline-flex;align-self:flex-start;padding:3px 9px;border-radius:1000px;background:var(--fill-tertiary);font-size:13px;line-height:18px;color:var(--label)}

/* строка списка (List Item): слот 40 для иллюстрации, 22 — для иконки/номера/чекбокса */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.li__lead{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.li__lead img{width:40px;height:40px;object-fit:contain}
.li__lead .emo{font:400 28px/1 var(--emoji)}
.li__tx{flex:1;min-width:0;font-size:16px;line-height:21px}
.li__tx b{display:block;font-weight:600}
.li__tx small{display:block;font-size:14px;line-height:19px;color:var(--secondary);margin-top:2px}

/* карточка дня */
.day{padding:20px 16px 16px;gap:14px;border-width:0;box-shadow:none}
.day.is-today{box-shadow:inset 0 0 0 2px var(--green)}
.day__top{align-items:center;padding:0 4px}
.day__date{gap:8px;align-items:baseline}
.day__date b{font-weight:600;font-size:23px;line-height:29px;letter-spacing:-.1px;transform:none}
.day__date span{font-weight:600;font-size:23px;line-height:29px;letter-spacing:-.1px;color:var(--label);opacity:.2}
.day__date .today{color:var(--green);opacity:1}
.day__date span:has(.today){opacity:1}
.day__cities{padding-top:0;gap:6px}
.dash{border:0;border-top:1px dashed var(--dash);margin:0}
.sum{gap:0;padding:0}
.sum .li{padding:10px 0}

/* плашка со строками: 6 сверху/снизу, строки сами держат 16 по бокам */
.check{padding:6px 0;border-radius:24px;background:var(--set-bg)}
.day .tasks{background:var(--raised)}
.check__item{gap:12px;padding:10px 16px;min-height:0;align-items:flex-start}
.check__item + .check__item{margin-top:0;padding-top:10px}
.check__item + .check__item::before{left:50px;right:16px;border-top-color:var(--dash)}
.check__box{border-color:var(--tertiary)}
.check__box.is-done{background:var(--green);border-color:var(--green)}
.is-guest .check__box.is-done{background:var(--green);border-color:var(--green)}
.check__text{padding-top:0}
.check__text b{font-weight:600}
.check__text.is-done b{color:var(--tertiary)}

/* вложение / документ: иконка 22, текст на 34 */
.att{gap:12px;padding:10px 16px;border-radius:20px;background:var(--raised)}
.sheet .att,.pg .att{background:var(--set-bg)}
.att__thumb{width:22px;height:22px;border:0;border-radius:0;background:none;color:var(--control);font:400 18px/1 var(--emoji)}
.att__thumb svg{width:18px;height:18px}
.att__thumb img{width:22px;height:22px;object-fit:contain;image-rendering:auto}
.att__tx{font-size:15px;line-height:20px}
.att__tx small{font-size:14px;line-height:19px;margin-top:2px}
.att.is-locked{opacity:.4}
.att.is-locked .att__thumb{filter:none;opacity:1}

/* «где живём» */
.stay{padding:16px;border-radius:32px;justify-content:flex-start;gap:12px}
.stay{width:100%;text-align:left;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.stay__ill{width:40px;height:40px;flex:none;object-fit:contain}
.stay__tx{flex:1}

/* папки «Полезное» */
.set{height:176px;padding:20px;gap:6px;align-items:center;justify-content:center;text-align:center;border-radius:32px}
.set__ill{width:91px;height:91px;object-fit:contain;flex:none;transition:transform .6s cubic-bezier(.25,1.6,.4,1)}
.set__t{font-weight:600;font-size:16px;line-height:21px}
.set__count{font-weight:400;font-size:13px;line-height:18px;margin-top:-6px}
@media (hover:hover){.set:hover .set__ill{transform:translateY(-3px) rotate(-3deg)}}

/* места по порядку */
.stops{padding:6px 0;border-radius:24px;background:var(--set-bg)}
.stop{position:relative;padding:10px 16px;gap:12px}
.stop + .stop::before{content:"";position:absolute;left:50px;right:16px;top:0;border-top:1px dashed var(--dash)}
.stop__n{width:22px;height:22px;border:0;background:var(--fill-tertiary);font:400 13px/1 "Inter",sans-serif;color:var(--secondary)}
.stop__n.is-home{background:none}
.stop__n.is-home img{width:22px;height:22px;object-fit:contain}
.stop__tx b{display:block;font-weight:600}
.stop.is-home .stop__tx{color:var(--label)}
.sh-kicker{font-size:14px;line-height:19px;margin-bottom:2px}
.sh-title{font-size:34px;line-height:41px;letter-spacing:-.4px}
.sh-head .wrap{margin-top:8px}

/* шаги визы — номера как у мест */
.step::before{width:22px;height:22px;font:400 13px/1 "Inter",sans-serif;background:var(--fill-tertiary)}
.step + .step::after{left:34px;border-top-color:var(--dash)}

/* отели и перелёты */
.hotel .stay__map{width:40px;height:40px;background:var(--raised);box-shadow:none}
.hotel__dates div{background:var(--raised)}
.pg .hotel .btn-route,.sheet .hotel .btn-route{background:var(--raised)}
.leg + .leg{border-top-color:var(--dash)}

/* деньги: чек с зубчиками, суммы списком */
.mbal{background:var(--raised);border-radius:16px 16px 0 0;padding:16px 16px 12px;gap:12px;position:relative;z-index:3;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.mbal::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:var(--raised);
  -webkit-mask:radial-gradient(circle 12.5px at 50% 100%,transparent 12px,#000 12.5px) 7px 0/31.9px 12px repeat-x;mask:radial-gradient(circle 12.5px at 50% 100%,transparent 12px,#000 12.5px) 7px 0/31.9px 12px repeat-x}
.mcur{padding:0 0 8px;margin:0;border:0;justify-content:space-between}
.mcur__l{flex:1;color:var(--secondary);font-weight:500;font-size:15px;line-height:20px}
.mbal .dash{margin:0}
.mbal__row{margin-top:0;padding:8px 0;font-weight:600}
.mbal__res .stay__meta{padding:8px 0}
.mlist{padding:6px 0}
.mrow{padding:10px 16px}
.mrow + .mrow::before{left:16px;right:16px;border-top-color:var(--dash)}
.mrow--back b,.mrow--back .mrow__sum{color:var(--green)}
.mday{padding:8px 4px 0}
#mMenu{top:56px}
.btn-ic{width:22px;height:22px;object-fit:contain;flex:none}

/* карточка дня v26: дата над карточкой, бейдж города висит сверху справа, белые плашки через 8 */
.days--home{gap:24px;padding-top:16px}
.dayw{display:flex;flex-direction:column;gap:8px}
.day__lbl{font-weight:500;font-size:15px;line-height:20px;color:var(--secondary)}
.day__lbl.is-today{color:var(--green)}
.day{padding:12px 16px 16px;gap:8px}
.day__badge{position:absolute;top:-10px;right:16px;z-index:1;display:flex}
.att{padding:16px}
.callout{display:block;padding:6px 0;border-radius:24px;background:var(--raised);font-size:inherit;line-height:inherit}
.sheet .callout,.pg .callout{background:var(--set-bg)}
.callout .li{padding:10px 16px;align-items:flex-start}
.li__lead--22{width:22px;height:21px}
.li__lead--22 img{width:22px;height:22px}
.li__lead--22 .emo{font:400 18px/21px var(--emoji)}

/* шапка в компактном виде: заголовок и подзаголовок друг под другом, отступ от «назад» */
.ctitle span:empty{display:none}
#phone.is-page .ctitle{padding-left:12px}
/* чек «Кто кому должен»: тень сильнее, до следующего блока 24 */
.mbal{margin-bottom:27px;box-shadow:var(--receipt-shadow)}
.mbal + .mday{padding-top:0}
/* переключатели: смена активного без скачков */
.chip{gap:0!important;transition:padding .35s cubic-bezier(.3,1.2,.5,1)}
.chip .chip__seg{transition:padding .35s cubic-bezier(.3,1.2,.5,1),background-color .3s,box-shadow .3s}
.chip__n{transition:margin .35s cubic-bezier(.3,1.2,.5,1)}
.chip.is-active .chip__n{margin-left:4px}
.chip.is-active svg{margin-left:4px}
.sheet__acts .sheet__add{width:44px;height:44px;border-radius:50%}
.mmenu.lg{background:var(--mglass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.sheet .chip{background:var(--fill-tertiary)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.94)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.9)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.sheet__body.stagger > *{animation:rise .6s cubic-bezier(.2,1.2,.35,1) both}
.sheet__body.stagger > *:nth-child(1){animation-delay:.08s}
.sheet__body.stagger > *:nth-child(2){animation-delay:.13s}
.sheet__body.stagger > *:nth-child(3){animation-delay:.18s}
.sheet__body.stagger > *:nth-child(4){animation-delay:.23s}
.sheet__body.stagger > *:nth-child(n+5){animation-delay:.28s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== прототип v2: дополнения к дизайн-системе гайда ===== */
#phone.has-back .pg-back{display:flex}
#phone.has-back .ctitle{padding-left:12px}
#phone.no-tabs .tabbar{transform:translateY(150%);opacity:0;pointer-events:none}
#phone .toolbar__trailing{gap:10px}
.btn-acc{background:var(--accent)!important;box-shadow:var(--accent-shadow)!important}
.btn-acc .sym{color:var(--on-accent)!important}
.btn-acc.lg::after{display:none}
#tMenu{right:16px}
.home{display:flex;flex-direction:column;gap:12px;padding:8px 16px 0}
.home .sets{padding:0;overflow:visible}
.home .label{margin:12px 4px 0}
.set__flag{font:400 64px/80px var(--emoji);height:91px;display:flex;align-items:center}
.set.is-empty{background:transparent;border:1.5px dashed var(--dash)}
.set.is-empty .set__ill{opacity:.5;filter:grayscale(.5)}
.dashbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:72px;padding:16px;border-radius:24px;border:1.5px dashed var(--dash);background:transparent;text-align:center;color:var(--label)}
.dashbox b{font-weight:600;font-size:16px;line-height:21px}
.dashbox--row{flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;border-radius:32px}
.dashbox--day{align-items:stretch;padding:4px 16px;border-radius:32px}
.dashbox--day .li + .li{border-top:1px dashed var(--dash)}
.dashbox--row .stay__ill{opacity:.6}
.sub2{color:var(--secondary)}
.plus{color:var(--blue);font-size:20px;flex:none}
.welcome{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.welcome__ill{width:120px;height:120px;object-fit:contain;align-self:center}
.flag{font:400 56px/64px var(--emoji)}
.stack{display:flex;flex-direction:column;gap:8px}
.fld{display:flex;flex-direction:column;flex:1;min-width:0}
.fld .label{margin:0 4px 6px;font-size:13px;line-height:18px}
.in{width:100%;height:48px;border:0;border-radius:16px;padding:0 16px;background:var(--fill-tertiary);color:var(--label);font:400 16px/21px "Inter",sans-serif;outline:none;-webkit-appearance:none;appearance:none}
textarea.in{height:88px;padding:12px 16px;resize:none}
input[type=file].in{padding-top:13px;font-size:14px}
.in + .in,.in + .btn2{margin-top:8px}
.inline{display:flex;gap:8px;align-items:flex-end}
.wbar{height:4px;border-radius:2px;background:var(--fill-tertiary);margin-top:8px}
.wbar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;font-size:16px;line-height:21px}
.kv + .kv{border-top:1px dashed var(--dash)}
.kv span{color:var(--secondary)}
.kv b{font-weight:600}
.check .li{padding:10px 16px}
.check .li + .li{border-top:1px dashed var(--dash)}
.mini{flex:none;min-width:32px;height:32px;padding:0 10px;border-radius:1000px;background:var(--fill-tertiary);font-size:15px}
.mini__v{flex:none;min-width:58px;text-align:center;font-size:14px;color:var(--secondary)}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 22px;border-radius:1000px;background:var(--set-bg);color:var(--label);font-weight:600;font-size:16px;text-align:center}
.btn2.is-danger{color:var(--danger)}
.linkbtn{color:var(--blue);font-size:15px;line-height:20px;padding:4px;text-align:left}
.chips--seg{padding:0 0 4px;margin:0;flex-wrap:wrap}
.chip--add .chip__seg{padding:6px 14px!important;color:var(--blue)}
.chip svg{color:var(--secondary)}
.mbal__tx{font-weight:400!important;align-items:flex-start}
.mbal__tx small{display:block;font-size:13px;line-height:18px;color:var(--secondary);font-weight:400}
.mbal__tx b{font-weight:600}
.dash--strong{border-top:1.5px solid var(--label)!important;opacity:.85}
.pos{color:var(--green)!important}.neg{color:var(--danger)!important}
.av{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--fill-tertiary);font:600 12px/1 "Inter",sans-serif;color:var(--label)}
.stop__tx{text-align:left}
button.stop__tx{background:none;padding:0;color:inherit}
.stop__n .emo{font:400 16px/1 var(--emoji)}
.stop__n.is-home img{width:22px;height:22px;object-fit:contain}
.li__lead .emo{font:400 26px/1 var(--emoji)}
.hotel{cursor:pointer}
.cbx{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:1px}
.more{margin-top:12px}
.more summary{color:var(--secondary);font-size:15px;line-height:20px;padding:6px 4px;cursor:pointer}
.more[open] summary{margin-bottom:8px}
.qr{width:160px;height:160px;margin:4px auto;border-radius:20px;background:repeating-linear-gradient(45deg,var(--label) 0 6px,transparent 6px 12px);border:12px solid var(--set-bg)}

/* карта */
.map{position:relative;height:230px;border-radius:24px;overflow:hidden;background:#e9ece6;background-image:linear-gradient(#d9ddd5 1px,transparent 1px),linear-gradient(90deg,#d9ddd5 1px,transparent 1px),linear-gradient(28deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%),linear-gradient(-62deg,transparent 60%,#fff 60%,#fff 63%,transparent 63%);background-size:28px 28px,28px 28px,100% 100%,100% 100%}
.mapq{position:absolute;left:10px;right:10px;top:10px;height:44px;border:0;border-radius:1000px;padding:0 16px;background:#fff;color:#000;font:400 16px "Inter",sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:2;outline:none}
.mapcap{position:absolute;right:12px;bottom:8px;font-size:10px;color:#888}
.pin{position:absolute;width:18px;height:18px;margin:-18px 0 0 -9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#888;border:2px solid #fff}
.pin.on{background:var(--danger);width:24px;height:24px;margin:-24px 0 0 -12px}

/* ручка перетаскивания — 6 точек */
.grip{display:grid;grid-template-columns:4px 4px;gap:3px 4px;padding:8px 2px 8px 8px;cursor:grab;touch-action:none;flex:none}
.grip i{width:4px;height:4px;border-radius:50%;background:var(--tertiary);display:block}
.prow.dragging{background:var(--raised);box-shadow:0 8px 24px rgba(0,0,0,.14);border-radius:16px;z-index:2;position:relative}
.prow.dragging::before{display:none}

/* шторка-форма */
.fov{position:absolute;inset:0;z-index:24;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s}
.fov.is-open{opacity:1;pointer-events:auto}
.fsheet{z-index:25!important;top:96px!important}
.fsheet .sheet__body{padding:8px 16px 40px;overflow-y:auto;flex:1}
.fsh__head{display:flex;align-items:center;gap:12px;padding:20px 16px 8px}
.fsh__head h2{flex:1;min-width:0;font-weight:700;font-size:22px;line-height:28px;letter-spacing:-.3px}
.fsheet .pg{gap:12px}

/* панель прототипа — вне телефона */
.ppanel{position:fixed;left:16px;top:16px;width:200px;display:flex;flex-direction:column;gap:8px;z-index:100;font:400 13px/17px -apple-system,"Inter",sans-serif;color:#111}
.pbox{background:#fff;border-radius:14px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:2px}
.pbox p{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:4px 6px}
.pbox button{padding:7px 8px;border-radius:9px;text-align:left;color:#111}
.pbox button:hover{background:#f2f2f2}
.pbox button.on{background:#111;color:#fff}
#pToggle{display:none}
@media (max-width:900px){
  .ppanel{top:auto;bottom:16px;left:auto;right:16px;width:auto}
  .ppanel .pbox{display:none}
  body.panel-open .ppanel .pbox{display:flex}
  #pToggle{display:block;align-self:flex-end;padding:10px 14px;border-radius:1000px;background:#111;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}
}


/* рамка телефона вокруг экрана прототипа */
@media (min-width:501px){
  html,body{background:#e3e3e8}
  .phone{border-radius:52px!important;box-shadow:0 0 0 11px #1c1c1e,0 0 0 13px #3a3a3c,0 40px 90px rgba(0,0,0,.28)!important}
}
@media (min-width:501px) and (prefers-color-scheme: dark){
  html,body{background:#2a2a2e}
  .phone{box-shadow:0 0 0 11px #0b0b0c,0 0 0 13px #4a4a4e,0 40px 90px rgba(0,0,0,.6)!important}
}

/* v6.4 */
.fsheet{top:auto!important;max-height:calc(100% - 60px);overflow:visible!important}
.fsheet .sheet__body{border-radius:0 0 0 0}
#fMenu{z-index:30}
.fsheet .sheet__body{flex:0 1 auto}
.fsh__head{align-items:flex-start}
.fsh__t{flex:1;min-width:0;padding-top:6px}
.fsh__t h2{font-weight:700;font-size:22px;line-height:28px;letter-spacing:-.3px}
.fsh__sub{margin-top:2px;font-size:15px;line-height:20px;color:var(--secondary)}
#fMenu{top:72px;right:64px}
#fMenu .is-danger span{color:var(--danger)}

.fsh__save{background:var(--accent)!important;color:var(--on-accent,#fff)!important;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.fsh__save::after{display:none!important}
.fsh__save svg{width:22px;height:22px}
.is-hoisted{display:none!important}
.sheet__map{display:flex;align-items:center;justify-content:center;width:44px!important;height:44px!important}
.sheet__map .gm{height:22px!important;width:auto}
#sheet .sheet__head{justify-content:space-between!important}
#sheet .sh-head{padding-right:0!important}
#sheet .sheet__body{padding-top:77px!important}
/* полезное */
#view > .sets.sets--grid{padding:20px 16px 120px!important;margin:0!important;overflow:visible!important}
/* пустой день */
.dashl{display:flex;flex-direction:column;gap:4px;padding:6px 0;border:1.5px dashed var(--dash);border-radius:24px}
.dli{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;text-align:left;color:var(--label);background:none;cursor:pointer}
.dli + .dli::before{content:"";position:absolute;left:50px;right:16px;top:-2px;border-top:1px dashed var(--dash)}
.dli:active{opacity:.6}
/* карта в форме */
.mapbox{height:240px!important}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbox .sq--map{position:absolute;z-index:2;left:12px;right:12px;top:12px}
#hotRes,#mapRes{margin-top:-8px}
/* место: ссылка и своё */
#pmLink:not([hidden]),#pmOwn:not([hidden]){display:flex;flex-direction:column;gap:16px}
.links{display:flex;flex-direction:column;align-items:center;gap:12px}
.links .linkin.is-on{font-weight:600}
.fsh__bar > .fsh__sp{flex:1 1 auto}
#view .pg > div > .label:not(:last-child),#view .pg > section > .label:not(:last-child){margin:0 0 8px!important}
/* нижние «добавить» — делитель с теми же отступами, что между пунктами */
.addrow{position:relative;border-top:0!important}
.addrow::before{content:"";position:absolute;left:50px;right:16px;top:0;border-top:1px dashed var(--dash)}
.steps > .addrow{padding-left:0;padding-right:0}
.steps > .addrow::before{left:34px;right:0}
.addrow > span:first-child{display:inline-flex;justify-content:center;align-items:center;flex:none}
.addrow > span:first-child svg{width:18px;height:18px}
.qrbox{flex-direction:column;align-items:center;gap:16px}
.qrbox #invLink{margin:0;text-align:center;word-break:break-all}
.linkbtn{display:flex;align-items:center;justify-content:center;text-decoration:none}
/* компактная шапка: 10 от кнопок до низа */
.is-compact .bar{padding-bottom:10px!important}
/* таймер «отправить ещё раз» — цифры не прыгают */
#resend{font-variant-numeric:tabular-nums}
.dli__ill{width:22px;height:22px;object-fit:contain}
.sheet .dashl{background:none}

    var v = conv(e.amt, e.cur);
    if (e.kind === "ref"){ b[e.payer] += v; b[e.to] -= v; return; }
    b[e.payer] += v; var p = shares(t, e); Object.keys(p).forEach(function(id){ b[id] -= conv(p[id], e.cur); });
  });
  return b;
}
function transfers(t, only){
  var b = balances(t, only), pos = [], neg = [], out = [];
  Object.keys(b).forEach(function(id){ if (b[id] > 0.5) pos.push({id:id, v:b[id]}); else if (b[id] < -0.5) neg.push({id:id, v:-b[id]}); });
  pos.sort(function(a,b){return b.v-a.v;}); neg.sort(function(a,b){return b.v-a.v;});
  while (pos.length && neg.length){ var p = pos[0], n = neg[0], v = Math.min(p.v, n.v); out.push({from:n.id, to:p.id, v:v}); p.v -= v; n.v -= v; if (p.v < 0.5) pos.shift(); if (n.v < 0.5) neg.shift(); }
  return out;
}
function debtLines(t){
  var out = [];
  t.money.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(e){
    if (e.kind === "ref"){ out.push({title:e.title, from:e.payer, to:e.to, v:e.amt, cur:e.cur, ref:true}); return; }
    var p = shares(t, e); Object.keys(p).forEach(function(id){ if (id !== e.payer && p[id] > 0) out.push({title:e.title, from:id, to:e.payer, v:p[id], cur:e.cur}); });
  });
  return out;
}

var MAXF = 8 * 1024 * 1024;
function readB64(f){ return new Promise(function(ok, bad){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(",")[1]); }; r.onerror = bad; r.readAsDataURL(f); }); }
async function putFile(t, docId, f){
  if (!f) return true;
  if (f.size > MAXF){ toast("Файл больше 8 МБ — сожмите его"); return false; }
  toast("Загружаем файл…");
  try { var b = await readB64(f); var r = await sb.rpc("tp_file_put", {p_trip:t.id, p_id:docId, p_name:f.name, p_mime:f.type || "application/octet-stream", p_b64:b}); if (r.error) throw r.error; toast("Файл загружен"); return true; }
  catch(e){ console.warn(e); toast("Файл не загрузился — попробуйте ещё раз"); return false; }
}
var FILECACHE = {};
async function openDoc(id){
  var t = trip(), doc = t.docs.filter(function(x){ return x.id === id; })[0]; if (!doc) return;
  if (!doc.file){ toast("Файла пока нет — прикрепите его"); return; }
  if (S.role === "guest"){ toast("Файл открывают участники поездки"); return; }
  var w = null; try { w = window.open("", "_blank"); } catch(e){}
  try {
    var key = t.id + "/" + doc.file, url = FILECACHE[key];
    if (!url){
      if (w) w.document.write('<p style="font:16px -apple-system,sans-serif;padding:24px;color:#888">Открываем…</p>');
      var r = await sb.rpc("tp_file_get", {p_trip:t.id, p_id:doc.file}); if (r.error || !r.data) throw r.error || new Error("no file");
      var bin = atob(r.data.b64), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      url = FILECACHE[key] = URL.createObjectURL(new Blob([arr], {type:r.data.mime || "application/octet-stream"}));
    }
    if (w && !w.closed) w.location.href = url; else location.href = url;
  } catch(e){ if (w) w.close(); console.warn(e); toast("Не получилось открыть файл"); }
}

      b.innerHTML = nb(S.hmap.res.slice(0, 4).map(function(x, i){ var parts = String(x.display_name||"").split(",").map(function(s){ return s.trim(); });
        return '<button class="stop" data-act="hotPick" data-i="'+i+'"><span class="stop__n is-icon">'+IC.search+'</span><span class="stop__tx"><b>'+esc(parts[0])+'</b><small>'+esc(parts.slice(1, 3).join(", "))+'</small></span></button>'; }).join("")); }).catch(function(){}); }, 600); };
A.hotPick = function(d){ var x = S.hmap.res[+d.i]; if (!x) return; var a = String(x.display_name||"").split(",").slice(0, 3).map(function(s){ return s.trim(); }).join(", ");
  var i = $("fHa"); i.value = a; i.dispatchEvent(new Event("input", {bubbles:true})); clearTimeout(hotT); $("hotRes").hidden = true;
  $("fHl").value = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a); $("mapFrame").src = gmap(x.lat+","+x.lon, 16); };

/* место: сохранение — галочкой сверху */
var _addPlace3 = A.addPlace;
A.addPlace = function(){ _addPlace3(); var b = $("mapAdd"); if (b) b.classList.add("is-hoisted");
  document.querySelectorAll("#pmLink .btn2, #pmOwn .btn2").forEach(function(x){ x.classList.add("is-hoisted"); });
  $("fSave").hidden = false;
  S.fSave = function(){ if (!$("pmLink").hidden) A.placeAddLink(); else if (!$("pmOwn").hidden) A.placeAddMan(); else if (S.map.pick == null) toast("Найдите место на карте"); else A.placeAddPick(); }; };
A.placeMode = function(d){ var l = $("pmLink"), o = $("pmOwn"), was = d.m === "link" ? !l.hidden : !o.hidden;
  l.hidden = was || d.m !== "link"; o.hidden = was || d.m !== "own";
  document.querySelectorAll('[data-act="placeMode"]').forEach(function(b){ b.classList.toggle("is-on", (b.getAttribute("data-m") === "link" && !l.hidden) || (b.getAttribute("data-m") === "own" && !o.hidden)); });
  var box = !l.hidden ? l : !o.hidden ? o : null; if (box){ anim(box, [{opacity:0, transform:"translateY(-6px)"},{opacity:1, transform:"none"}], {duration:320, easing:SPRING}); var f = box.querySelector("input"); if (f) f.focus(); } };
/* переезд: «Заметка» и билет — пунктирной плашкой */
var _moveSheet2 = A.moveSheet;
A.moveSheet = function(d){ _moveSheet2(d); var n = $("fMn"); if (n){ var l = n.closest(".fld"); if (l) l.querySelector(".label").textContent = "Заметка"; }
  var f = $("fMfile"); if (!f) return; var lab = f.closest(".fld"); if (!lab) return;
  var card = document.createElement("label"); card.className = "addcard"; card.id = "fMfCard";
  card.innerHTML = '<span class="addcard__ic">'+IC.add+'</span><span class="addcard__tx"><b>Добавить билет</b><small>PDF или скриншот</small></span>';
  var inp = document.createElement("input"); inp.type = "file"; inp.id = "fMfile"; inp.hidden = true; card.appendChild(inp); lab.parentNode.replaceChild(card, lab);
  inp.onchange = function(){ var x = inp.files[0]; if (x) card.querySelector("b").textContent = x.name; }; };
/* ссылка-приглашение — внутри плашки с QR */
var _inviteSheet2 = A.inviteSheet;
A.inviteSheet = function(){ _inviteSheet2(); var b = document.querySelector("#fBody .qrbox"), l = $("invLink"); if (b && l){ b.appendChild(l); } };

/* документ: можно добавить ссылку вместо файла (или вместе с ним) */
function normUrl(l){ l = (l || "").trim(); return l && !/^https?:\/\//i.test(l) ? "https://" + l : l; }
var _addDoc3 = A.addDoc;
A.addDoc = function(pre){ _addDoc3(pre); var t = $("fDt"); if (!t) return; var f = t.closest(".fld");
  f.insertAdjacentHTML("afterend", fld("Или ссылка", '<input class="in" id="fDl" type="url" inputmode="url" autocomplete="off" placeholder="https://drive.google.com/…">')); };
var _docSave3 = A.docSave;
A.docSave = async function(){
  var l = normUrl(val("fDl")), t = trip();
  if (l && !val("fDt") && !($("fDf") && $("fDf").files[0])){ try { $("fDt").value = new URL(l).hostname.replace(/^www\./, ""); } catch(_){ toast("Проверьте ссылку"); return; } }
  if (l){ t.docs.push = function(d){ d.link = l; return Array.prototype.push.apply(this, arguments); }; }
  try { await _docSave3(); } finally { delete t.docs.push; }
};
var _docBtn2 = docBtn;
docBtn = function(doc, can){
  var a = doc.link ? '<a class="'+(doc.file ? 'btn2' : 'primary')+' linkbtn" href="'+esc(doc.link)+'" target="_blank" rel="noopener">Открыть ссылку</a>' : '';
  if (doc.file) return '<div class="stack">'+_docBtn2(doc, can)+a+'</div>';
  return a || _docBtn2(doc, can);
};
var _docSheet2 = A.docSheet;
A.docSheet = function(d){ _docSheet2(d); var doc = trip().docs.filter(function(x){ return x.id === d.id; })[0], s = document.querySelector('#fBody [data-input="docSubT"]');
  if (doc && s){ s.closest(".fld").insertAdjacentHTML("afterend", fld("Ссылка", '<input class="in" type="url" inputmode="url" autocomplete="off" data-input="docLink" value="'+esc(doc.link || "")+'" placeholder="https://drive.google.com/…">')); } };
INP.docLink = function(v){ var d = trip().docs.filter(function(x){ return x.id === S.docId; })[0]; if (!d) return; d.link = normUrl(v); render(); };

/* пустой день: «Запланировать день» с солнышком, обычным текстом */
function sunRow(act, attr){ return '<button class="dli" data-act="'+act+'"'+(attr||'')+'><span class="addcard__ic">'+ill("sun", "dli__ill")+'</span><span class="addcard__tx"><b>Запланировать день</b><small>что посмотреть, где поесть</small></span></button>'; }
var _dayCardG = dayCard;
dayCard = function(t, d){ var h = _dayCardG(t, d);
  return h.replace(/<button class="dli" data-act="dayAddPlace"([^>]*)>[^]*?<\/button>/, function(_, a){ return sunRow("dayAddPlace", a); }); };
var _openDayG = openDay;
openDay = function(k){ _openDayG(k); var t = trip(), pl = $("plist"); if (!pl || ro() || (t.places[k] || []).length) return;
  pl.className = "dashl"; pl.innerHTML = sunRow("addPlace"); };

/* «Проверьте почту»: только код и одна строка про повторную отправку */
SCR.code = function(){
  var left = Math.max(0, Math.ceil(((S.sentAt || 0) + 60000 - Date.now()) / 1000));
  return {title:"Проверьте почту", sub:"Отправили код на "+esc(S.email), back:true, tabs:false, view:'<div class="pg pg--form">'+
    fld("Код из письма", '<input class="in" id="fCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="8 цифр" data-input="codeIn">')+
    '<button class="primary" data-act="checkCode">Войти</button><p class="hint hint--c" id="resend">'+resendText(left)+'</p></div>'};
};
resendText = function(left){ return left ? 'Не пришло? Отправить ещё раз через 0:'+String(left).padStart(2,"0") : 'Не пришло? <button class="linkin" data-act="resend">Отправить ещё раз</button>'; };

</script>
