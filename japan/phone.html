<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyGo — на телефоне</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#ececee;font-family:-apple-system,"Inter",sans-serif;overflow:hidden}
  body.dark{background:#1c1c1f}
  .stage{transform-origin:center center}
  .phone{position:relative;width:402px;height:874px;padding:14px;border-radius:68px;background:#111;
    box-shadow:0 0 0 2px #2a2a2c inset,0 0 0 1px #000,0 30px 80px rgba(0,0,0,.25)}
  .screen{position:relative;width:402px;height:874px;border-radius:55px;overflow:hidden;background:#fff}
  .screen iframe{display:block;width:402px;height:820px;border:0}
  .sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 48px;box-sizing:border-box;font:600 17px/22px -apple-system,"Inter",sans-serif;color:#000;background:var(--sbg,#fff)}
  .sb svg{display:block;fill:currentColor}.sb .ic{display:flex;gap:6px;align-items:center}
  .island{position:absolute;top:25px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
  .btn{position:absolute;width:4px;border-radius:2px;background:#2a2a2c}
  .b1{left:-4px;top:180px;height:34px}.b2{left:-4px;top:240px;height:64px}.b3{left:-4px;top:316px;height:64px}.b4{right:-4px;top:260px;height:100px}
  .bar{position:fixed;top:16px;left:16px;display:flex;gap:8px}
  .bar button{height:36px;padding:0 14px;border:0;border-radius:18px;background:#fff;font:500 14px/20px inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  body.nof .phone{padding:0;background:none;box-shadow:0 20px 60px rgba(0,0,0,.15);border-radius:0}
  body.nof .screen{border-radius:0}
  body.nof .island,body.nof .btn{display:none}
  .bar button.is-on{background:#000;color:#fff}
  body.dark .bar button{background:#2c2c2e;color:#fff}
</style>
</head>
<body>
<div class="bar">
  <button id="reload" type="button">Обновить</button>
  <button id="theme" type="button">Фон</button>
  <button id="frame" type="button" class="is-on">Рамка</button>
</div>
<div class="stage" id="stage">
  <div class="phone">
    <span class="btn b1"></span><span class="btn b2"></span><span class="btn b3"></span><span class="btn b4"></span>
    <div class="screen">
      <div class="island"></div>
      <div class="sb" id="sb"><span>9:41</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.2 0 4.2.9 5.7 2.3l1.1-1.1C13 2 10.6 1 8 1S3 2 1.2 3.8l1.1 1.1C3.8 3.5 5.8 2.6 8 2.6zm0 3.2c1.3 0 2.5.5 3.4 1.4l1.1-1.1C11.3 4.9 9.7 4.2 8 4.2s-3.3.7-4.5 1.9l1.1 1.1C5.5 6.3 6.7 5.8 8 5.8zm0 3.2c-.5 0-.9.2-1.2.5L8 10.7l1.2-1.2c-.3-.3-.7-.5-1.2-.5z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".4"/></svg></span></div>
      <iframe id="app" src="./" title="EasyGo"></iframe>
    </div>
  </div>
</div>
<script>
  function fit(){ var nof = document.body.classList.contains("nof"), s = Math.min(1, (innerHeight - 40) / (nof ? 874 : 902), (innerWidth - 40) / (nof ? 402 : 430)); document.getElementById("stage").style.transform = "scale(" + s + ")"; }
  addEventListener("resize", fit); fit();
  function syncSb(){ try { var d = document.getElementById("app").contentDocument, bg = getComputedStyle(d.body).backgroundColor, sb = document.getElementById("sb"); sb.style.background = bg; var m = bg.match(/\d+/g), dark = m && (+m[0]*0.3 + +m[1]*0.59 + +m[2]*0.11) < 128; sb.style.color = dark ? "#fff" : "#000"; } catch(e){} }
  setInterval(syncSb, 500);
  document.getElementById("reload").onclick = function(){ var f = document.getElementById("app"); f.src = f.src; };
  var fr = document.getElementById("frame"); function setFrame(on){ document.body.classList.toggle("nof", !on); fr.classList.toggle("is-on", on); try { localStorage.setItem("phoneFrame", on ? "1" : "0"); } catch(e){} fit(); }
  fr.onclick = function(){ setFrame(document.body.classList.contains("nof")); };
  try { if (localStorage.getItem("phoneFrame") === "0") setFrame(false); } catch(e){}
  document.getElementById("theme").onclick = function(){ document.body.classList.toggle("dark"); };
</script>
</body>
</html>
