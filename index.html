<!-- Paint the correct background before first frame so a dark-theme reload never flashes white. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('pf-theme');
      var dark = stored
        ? stored === 'dark'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var bg = dark ? '#000000' : '#ffffff';
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.style.background = bg;
      var s = document.createElement('style');
      s.textContent = 'html,body{background:' + bg + ';}';
      document.head.appendChild(s);
      // Paints the strips the phone draws around the page: the clock at the
      // top, the home bar at the bottom.
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', bg);
    } catch (e) {}
  })();
</script>

<!-- One-per-session splash spinner. -->
<script>
  (function () {
    try {
      if (sessionStorage.getItem('om-splash-seen')) return;
      sessionStorage.setItem('om-splash-seen', '1');
      var pref = localStorage.getItem('pf-theme');
      var dark = pref
        ? pref === 'dark'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var el = document.createElement('div');
      el.id = 'om-splash';
      el.style.background = dark ? '#000000' : '#ffffff';
      el.style.color = dark ? '#f5f5f7' : '#1d1d1f';
      el.innerHTML = '<i></i>';
      var mount = function () { document.body.appendChild(el); };
      if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
      var hide = function () { el.classList.add('done'); setTimeout(function () { el.remove(); }, 650); };
      // Reveal as soon as the markup is built. Waiting for `load` would hold
      // the page back until every image and video had finished downloading.
      var reveal = function () { setTimeout(hide, 200); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reveal);
      else reveal();
      setTimeout(hide, 2500);
    } catch (e) {}
  })();
</script>
